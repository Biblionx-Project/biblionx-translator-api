version: '3'
services:
  biblionx-translator-api:
    build: .
    image: biblionx/translator-api:2.4.0
    ports:
      - "3000:3000"
    networks:
      - redis-net
      - mongo-net
      - rabbitmq-net
    environment:
      BIBLIONX_PORT: 3000
      PORT: 3000
      BIBLIONX_DB_HOST: mongo
      DB_HOST: mongo
      BIBLIONX_DB_PORT: 27017
      DB_PORT: 27017
      BIBLIONX_DB_NAME: "biblionx-db"
      DB_NAME: "biblionx-db"
      BIBLIONX_CACHE_HOST: redis
      CACHE_HOST: redis
      BIBLIONX_CACHE_PORT: 6379
      CACHE_PORT: 6379
      BIBLIONX_CACHE_NAME: "biblionx-cache"
      CACHE_NAME: "biblionx-cache"
      CACHE_SIZE: 104857600
      CACHE_EXP: 604800
      BIBLIONX_AMQP_PROTOCOL: amqp
      AMQP_PROTOCOL: amqp
      BIBLIONX_AMQP_HOST: rabbitmq
      AMQP_HOST: rabbitmq
      BIBLIONX_AMQP_PORT: 5672
      AMQP_PORT: 5672
      BIBLIONX_AMQP_USER: ${BIBLIONX_AMQP_USER:-${AMQP_USER:-guest}}
      AMQP_USER: ${AMQP_USER:-guest}
      BIBLIONX_AMQP_PASS: ${BIBLIONX_AMQP_PASS:-${AMQP_PASS:-guest}}
      AMQP_PASS: ${AMQP_PASS:-guest}
      BIBLIONX_TRANSLATOR_QUEUE: "translate.to_text"
      TRANSLATOR_QUEUE: "translate.to_text"
      BIBLIONX_VIDEOMAKER_QUEUE: "translate.to_video"
      VIDEOMAKER_QUEUE: "translate.to_video"
      BIBLIONX_API_CONSUMER_QUEUE: "amq.rabbitmq.reply-to"
      API_CONSUMER_QUEUE: "amq.rabbitmq.reply-to"
    depends_on:
      - redis
      - mongo
      - rabbitmq

  redis:
    image: redis:alpine
    networks:
      - redis-net
    volumes:
      - redis-data:/data

  mongo:
    image: mongo
    networks:
      - mongo-net
    volumes:
      - mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:management-alpine
    networks:
      - rabbitmq-net
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}

networks:
  redis-net:
  mongo-net:
  rabbitmq-net:

volumes:
  redis-data:
  mongo-data:
  rabbitmq-data:
